[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injector-world-qa"
version = "1.0.0"
description = "Independent QA and UI/UX audit toolchain for injector.world, producing severity-ranked DOCX bug reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "heyaankit" }]
keywords = ["qa", "audit", "playwright", "python-docx", "ux", "testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright==1.62.0",
    "python-docx==1.2.0",
    "greenlet==3.5.4",
    "lxml==6.1.1",
    "pyee==13.0.1",
    "typing_extensions==4.16.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
